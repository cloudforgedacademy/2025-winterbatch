trigger:
- main

pool:
  name: jailbreak-pool

# ===================== PIPELINE VARIABLES =====================
# These MUST be here because VS Code variables are NOT visible to pipelines
variables:
  TF_IN_AUTOMATION: "true"
  ARM_USE_AZURECLI: "true"

  # Azure / Terraform variables
  RESOURCE_GROUP_NAME: cloudx-rg
  LOCATION: canadacentral

  # Existing Key Vault (NAME ONLY, NOT URL)
  KEY_VAULT_NAME: cloudx-keyvault3511
  KEY_VAULT_RESOURCE_GROUP: cloud-35-rg

# ===================== STAGES =====================
stages:

# =================================================
# TERRAFORM PLAN
# =================================================
- stage: Terraform_Plan
  displayName: Terraform Plan
  jobs:
  - job: Plan
    displayName: Terraform Plan Job
    steps:
    - checkout: self

    - script: terraform --version
      displayName: Check Terraform version

    - task: AzureCLI@2
      displayName: Azure Authentication
      inputs:
        azureSubscription: cloudx-azure-sc
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          echo "Azure authenticated"
          az account show

    - task: AzureCLI@2
      displayName: Terraform Init
      inputs:
        azureSubscription: cloudx-azure-sc
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          terraform init -input=false

    - task: AzureCLI@2
      displayName: Terraform Plan
      inputs:
        azureSubscription: cloudx-azure-sc
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          echo "RESOURCE_GROUP_NAME=$RESOURCE_GROUP_NAME"
          echo "LOCATION=$LOCATION"
          echo "KEY_VAULT_NAME=$KEY_VAULT_NAME"
          echo "KEY_VAULT_RESOURCE_GROUP=$KEY_VAULT_RESOURCE_GROUP"

          terraform plan \
            -input=false \
            -out=tfplan \
            -var "resource_group_name=$RESOURCE_GROUP_NAME" \
            -var "location=$LOCATION" \
            -var "key_vault_name=$KEY_VAULT_NAME" \
            -var "key_vault_resource_group_name=$KEY_VAULT_RESOURCE_GROUP"
      env:
        RESOURCE_GROUP_NAME: $(RESOURCE_GROUP_NAME)
        LOCATION: $(LOCATION)
        KEY_VAULT_NAME: $(KEY_VAULT_NAME)
        KEY_VAULT_RESOURCE_GROUP: $(KEY_VAULT_RESOURCE_GROUP)

    - publish: tfplan
      artifact: terraform-plan

# =================================================
# TERRAFORM APPLY (MANUAL APPROVAL)
# =================================================
- stage: Terraform_Apply
  displayName: Terraform Apply (Manual Approval Required)
  dependsOn: Terraform_Plan
  condition: succeeded()

  jobs:
  - deployment: Apply
    displayName: Terraform Apply Job
    environment: test
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - download: current
            artifact: terraform-plan

          - task: AzureCLI@2
            displayName: Terraform Apply
            inputs:
              azureSubscription: cloudx-azure-sc
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                echo "Applying Terraform plan"
                cp $(Pipeline.Workspace)/terraform-plan/tfplan .
                terraform init -input=false
                terraform apply -input=false -auto-approve tfplan

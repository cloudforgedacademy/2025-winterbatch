trigger:
- main

pool:
  name: jailbreak-pool

variables:
  TF_IN_AUTOMATION: "true"
  ARM_USE_AZURECLI: "true"

stages:

# ===================== PLAN STAGE =====================
- stage: Terraform_Plan
  displayName: Terraform Plan
  jobs:
  - job: Plan
    displayName: Terraform Plan Job
    steps:
    - checkout: self

    - script: terraform --version
      displayName: Check Terraform version

    - task: AzureCLI@2
      displayName: Azure Authentication
      inputs:
        azureSubscription: cloudx-azure-sc
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          az account show

    - task: AzureCLI@2
      displayName: Terraform Init
      inputs:
        azureSubscription: cloudx-azure-sc
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          terraform init -input=false

    - task: AzureCLI@2
      displayName: Terraform Plan
      inputs:
        azureSubscription: cloudx-azure-sc
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          terraform plan \
            -input=false \
            -out=tfplan \
            -var "resource_group_name=cloudx-rg" \
            -var "location=canadacentral" \
            -var "db_password=$DB_PASSWORD" \
            -var "client_secret=$CLIENT_SECRET" \
            -var "tenant_id=$TENANT_ID" \
            -var "object_id=$OBJECT_ID" \
            -var "key_vault_name=$KEY_VAULT_NAME"
      env:
        DB_PASSWORD: $(DB_PASSWORD)
        CLIENT_SECRET: $(CLIENT_SECRET)
        TENANT_ID: $(TENANT_ID)
        OBJECT_ID: $(OBJECT_ID)
        KEY_VAULT_NAME: $(KEY_VAULT_NAME)

    - publish: tfplan
      artifact: terraform-plan

# ===================== APPLY STAGE =====================
- stage: Terraform_Apply
  displayName: Terraform Apply (Manual Approval Required)
  dependsOn: Terraform_Plan
  condition: succeeded()

  jobs:
  - deployment: Apply
    displayName: Terraform Apply Job
    environment: test
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - download: current
            artifact: terraform-plan

          - task: AzureCLI@2
            displayName: Terraform Apply
            inputs:
              azureSubscription: cloudx-azure-sc
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                terraform init -input=false
                terraform apply -input=false -auto-approve tfplan

trigger:
- main

pool:
  name: jailbreak-pool

variables:
  TF_IN_AUTOMATION: "true"

  RESOURCE_GROUP_NAME: cloudx-rg
  LOCATION: canadacentral
  KEY_VAULT_NAME: cloudx-keyvault3511
  ALLOWED_RDP_IP: 0.0.0.0/0

  
  ADMIN_USERNAME: azureadmin
  ADMIN_PASSWORD: StrongPassword!123

stages:
- stage: Terraform_Plan
  displayName: Terraform Plan
  jobs:
  - job: Plan
    steps:
    - checkout: self

    - task: AzureCLI@2
      displayName: Terraform Plan (Authenticated)
      inputs:
        azureSubscription: cloudx-azure-sc
        scriptType: bash
        scriptLocation: inlineScript
        addSpnToEnvironment: true
        inlineScript: |
          set -e
          set +H

          export ARM_CLIENT_ID="$servicePrincipalId"
          export ARM_CLIENT_SECRET="$servicePrincipalKey"
          export ARM_TENANT_ID="$tenantId"
          export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"

          # Pass Terraform variables SAFELY via environment
          export TF_VAR_resource_group_name="$(RESOURCE_GROUP_NAME)"
          export TF_VAR_location="$(LOCATION)"
          export TF_VAR_key_vault_name="$(KEY_VAULT_NAME)"
          export TF_VAR_allowed_rdp_ip="$(ALLOWED_RDP_IP)"
          export TF_VAR_admin_username="$(ADMIN_USERNAME)"
          export TF_VAR_admin_password="$(ADMIN_PASSWORD)"

          terraform --version
          terraform init -input=false
          terraform plan -input=false -out=tfplan

          mkdir -p "$(Build.ArtifactStagingDirectory)/tf"
          cp tfplan "$(Build.ArtifactStagingDirectory)/tf/tfplan"

    - publish: $(Build.ArtifactStagingDirectory)/tf
      artifact: terraform-plan

- stage: Terraform_Apply
  displayName: Terraform Apply
  dependsOn: Terraform_Plan
  condition: succeeded()
  jobs:
  - deployment: Apply
    environment: test
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - download: current
            artifact: terraform-plan

          - task: AzureCLI@2
            displayName: Terraform Apply (Authenticated)
            inputs:
              azureSubscription: cloudx-azure-sc
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              inlineScript: |
                set -e
                set +H

                export ARM_CLIENT_ID="$servicePrincipalId"
                export ARM_CLIENT_SECRET="$servicePrincipalKey"
                export ARM_TENANT_ID="$tenantId"
                export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"

                export TF_VAR_resource_group_name="$(RESOURCE_GROUP_NAME)"
                export TF_VAR_location="$(LOCATION)"
                export TF_VAR_key_vault_name="$(KEY_VAULT_NAME)"
                export TF_VAR_allowed_rdp_ip="$(ALLOWED_RDP_IP)"
                export TF_VAR_admin_username="$(ADMIN_USERNAME)"
                export TF_VAR_admin_password="$(ADMIN_PASSWORD)"

                cp "$(Pipeline.Workspace)/terraform-plan/tfplan" "$(System.DefaultWorkingDirectory)/tfplan"
                terraform init -input=false
                terraform apply -input=false -auto-approve tfplan
